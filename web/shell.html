<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#06060c">
    <title>Last Stand - Horde Defense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06060c;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #06060c;
            color: #ffcd3c;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
        }
        #loading h1 { font-size: 2.4rem; text-shadow: 0 4px 0 #3a2000; }
        #progress-bar {
            width: 240px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
        }
        #progress { width: 0%; height: 100%; background: #ffcd3c; transition: width 0.2s; }
        #status { color: #aaa; font-size: 0.8rem; font-weight: 600; }
        #rotate {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(6, 6, 12, 0.94);
            color: #ffcd3c;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
            z-index: 10;
        }
        #rotate .phone {
            width: 46px;
            height: 80px;
            border: 5px solid #ffcd3c;
            border-radius: 10px;
            animation: turn 1.6s ease-in-out infinite;
        }
        @keyframes turn { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
        @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
            #rotate { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="rotate"><div class="phone"></div><div>TURN YOUR PHONE UPRIGHT</div></div>
    <div id="loading">
        <h1>LAST STAND</h1>
        <div id="progress-bar"><div id="progress"></div></div>
        <div id="status">Loading...</div>
    </div>
    <script>
        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            setStatus: function(text) {
                var loading = document.getElementById('loading');
                if (!text) { loading.style.display = 'none'; return; }
                document.getElementById('status').textContent = text.replace(/\(.*\)/, '');
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) document.getElementById('progress').style.width = (parseInt(m[2]) / parseInt(m[4])) * 100 + '%';
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function() { Module.setStatus('Something went wrong. Reload to try again.'); };

        // Browsers keep audio suspended until the first gesture; raylib's miniaudio contexts
        // live in Module.miniaudio.
        function resumeAudio() {
            if (typeof Module.miniaudio !== 'undefined') {
                for (var i = 0; i < Module.miniaudio.devices.length; i++) {
                    var d = Module.miniaudio.devices[i];
                    if (d != null) d.webaudio.resume();
                }
            }
        }
        ['click', 'keydown', 'touchstart', 'pointerdown'].forEach(function(e) {
            document.addEventListener(e, resumeAudio);
        });
        document.addEventListener('pointerdown', function() { Module.canvas.focus(); });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
